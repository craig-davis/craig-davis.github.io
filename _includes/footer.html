<footer class="site-footer">
  <div class="site-footer__inner">
    <div class="site-footer__brand" aria-label="There4">
      <span aria-hidden="true">{{ site.brand_symbol }}</span> {{ site.brand_domain }}
    </div>
    <nav class="footer-nav" aria-label="Footer navigation">
      <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
      {% if site.github_username %}<a href="https://github.com/{{ site.github_username }}">GitHub</a>{% endif %}
      <a href="mailto:{{ site.email | encode_email }}">Email</a>
    </nav>
    <p class="site-footer__note">
      &copy; {{ site.time | date: '%Y' }} {{ site.author }}. There4 may earn a commission from qualifying links. <a href="{{ '/about/#amazon-affiliate-links' | relative_url }}">Details</a>.
    </p>
  </div>
</footer>
