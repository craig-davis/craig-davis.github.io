<header class="site-header">
  <div class="site-header__inner">
    <a class="site-wordmark" href="{{ '/' | relative_url }}" aria-label="There4.io home">
      <span class="site-wordmark__symbol" aria-hidden="true">{{ site.brand_symbol }}</span>
      <span class="site-wordmark__lockup">
        <span class="site-wordmark__name">{{ site.brand_domain }}</span>
        <span class="site-wordmark__byline">{{ site.author }}</span>
      </span>
    </a>

    <nav class="primary-nav" aria-label="Primary navigation">
      <a href="{{ '/posts/' | relative_url }}"{% if page.url == '/posts/' or page.url contains '/tags/' %} aria-current="page"{% endif %}>Writing</a>
      <a href="{{ '/search/' | relative_url }}"{% if page.url == '/search/' %} aria-current="page"{% endif %}>Search</a>
      <a href="{{ '/projects/' | relative_url }}"{% if page.url == '/projects/' %} aria-current="page"{% endif %}>Projects</a>
      <a href="{{ '/gear/' | relative_url }}"{% if page.url == '/gear/' %} aria-current="page"{% endif %}>Gear</a>
      <a href="{{ '/about/' | relative_url }}"{% if page.url == '/about/' %} aria-current="page"{% endif %}>About</a>
    </nav>
  </div>
</header>
