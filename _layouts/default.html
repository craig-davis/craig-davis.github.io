<!DOCTYPE html>
<html lang="en">
{% include head.html %}
<body id="top" class="layout-{{ page.layout | default: 'default' }}">
  <a class="skip-link" href="#main-content">Skip to content</a>
  {% include nav.html %}
  <main id="main-content">
    {{ content }}
  </main>
  {% include footer.html %}
  {% if page.search_page %}<script src="{{ '/js/search.js' | relative_url }}?v=2" defer></script>{% endif %}
  {% if page.toc and page.toc.size > 0 %}<script src="{{ '/js/article-toc.js' | relative_url }}" defer></script>{% endif %}
</body>
</html>
